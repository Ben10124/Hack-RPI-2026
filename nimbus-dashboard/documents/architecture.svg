<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Atkinson Hyperlegible', 'Helvetica Neue', Arial, sans-serif">
  <title>Nimbus architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#44556a"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #15263b; stroke-width: 2; }
      .hub { fill: #ffffff; stroke: #2a78d6; stroke-width: 3.5; }
      .cloud { fill: #e6ecf1; stroke: #44556a; stroke-width: 2; stroke-dasharray: 8 6; }
      .pill { fill: #ffffff; stroke: #44556a; stroke-width: 1.5; }
      .h { font-size: 24px; font-weight: 700; fill: #15263b; }
      .t { font-size: 18px; fill: #15263b; }
      .s { font-size: 15px; fill: #44556a; }
      .topic { font-size: 15px; fill: #2a78d6; font-family: 'SFMono-Regular', Menlo, Consolas, monospace; }
      .flow { stroke: #44556a; stroke-width: 2.5; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fb"/>

  <!-- Title -->
  <text x="40" y="70" font-size="34" font-weight="700" fill="#15263b">Nimbus</text>
  <text x="40" y="102" class="s">Occupancy-aware ventilation</text>

  <!-- Cloud -->
  <rect x="480" y="80" width="640" height="140" rx="18" class="cloud"/>
  <text x="502" y="112" class="h">Cloud</text>
  <rect x="510" y="128" width="280" height="76" rx="12" class="pill"/>
  <text x="650" y="160" class="t" text-anchor="middle" font-weight="700">MongoDB Atlas</text>
  <text x="650" y="186" class="s" text-anchor="middle">history · decisions · holds</text>
  <rect x="810" y="128" width="280" height="76" rx="12" class="pill"/>
  <text x="950" y="160" class="t" text-anchor="middle" font-weight="700">Open-Meteo</text>
  <text x="950" y="186" class="s" text-anchor="middle">rain forecast</text>

  <!-- Server -->
  <rect x="560" y="320" width="480" height="260" rx="18" class="hub"/>
  <text x="584" y="360" class="h">Laptop · Node.js server</text>
  <text x="584" y="400" class="t">Built-in MQTT broker</text>
  <text x="584" y="432" class="t">Controller: fan + window every 5 s</text>
  <text x="584" y="464" class="t">Rules: people (ASHRAE 62.1), gas level,</text>
  <text x="584" y="490" class="t">rain chance, pressure trend, bookings</text>
  <text x="584" y="530" class="t">Dashboard, REST API, Socket.IO</text>

  <!-- UNO Q -->
  <rect x="40" y="360" width="340" height="180" rx="18" class="box"/>
  <text x="64" y="400" class="h">Arduino UNO Q</text>
  <text x="64" y="440" class="t">Grove Air Quality v1.3</text>
  <text x="64" y="464" class="s">relative gas level, not CO₂</text>
  <text x="64" y="504" class="t">Barometer: pressure, temp</text>

  <!-- Pi 4 -->
  <rect x="1220" y="300" width="340" height="300" rx="18" class="box"/>
  <text x="1244" y="340" class="h">Raspberry Pi 4</text>
  <text x="1244" y="380" class="t">Camera people counter</text>
  <text x="1244" y="404" class="s">on device, sends a number only</text>
  <text x="1244" y="450" class="t">Fan + window servo driver</text>
  <text x="1244" y="490" class="t">Fail-safe: closes the window</text>
  <text x="1244" y="514" class="t">after 10 s without the server</text>

  <!-- Dashboard -->
  <rect x="600" y="680" width="400" height="140" rx="18" class="box"/>
  <text x="624" y="720" class="h">Live dashboard</text>
  <text x="624" y="752" class="t">phone · laptop · projector</text>
  <text x="624" y="780" class="s">reasons, charts, manual hold</text>

  <!-- Model room -->
  <rect x="1220" y="680" width="340" height="140" rx="18" class="box"/>
  <text x="1244" y="720" class="h">Model room</text>
  <text x="1244" y="752" class="t">fan + top-hinged window</text>
  <text x="1244" y="780" class="s">gas sensor inside</text>

  <!-- Flows -->
  <line x1="380" y1="450" x2="556" y2="450" class="flow" marker-end="url(#arrow)"/>
  <text x="468" y="436" class="topic" text-anchor="middle">room1/sensors</text>

  <line x1="1220" y1="390" x2="1044" y2="390" class="flow" marker-end="url(#arrow)"/>
  <text x="1130" y="376" class="topic" text-anchor="middle">room1/occupancy</text>

  <line x1="1040" y1="470" x2="1216" y2="470" class="flow" marker-end="url(#arrow)"/>
  <text x="1130" y="456" class="topic" text-anchor="middle">room1/cmd</text>
  <text x="1130" y="494" class="topic" text-anchor="middle">+ heartbeat</text>

  <line x1="650" y1="320" x2="650" y2="208" class="flow" marker-end="url(#arrow)"/>
  <text x="662" y="270" class="s">store</text>
  <line x1="950" y1="204" x2="950" y2="316" class="flow" marker-end="url(#arrow)"/>
  <text x="962" y="270" class="s">every 10 min</text>

  <line x1="800" y1="584" x2="800" y2="676" class="flow" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="814" y="636" class="s">live updates · manual hold</text>

  <line x1="1390" y1="600" x2="1390" y2="676" class="flow" marker-end="url(#arrow)"/>
  <text x="1404" y="644" class="s">PWM</text>

  <!-- Network note -->
  <text x="40" y="740" class="t" font-weight="700">One phone hotspot</text>
  <text x="40" y="768" class="s">every device talks MQTT to the laptop, port 1883</text>
  <text x="40" y="792" class="s">decisions stay local; the cloud keeps history</text>
</svg>
